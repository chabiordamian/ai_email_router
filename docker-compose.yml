name: ai-email-router

services:
  api:
    build:
      context: .
    environment:
      DEPARTMENTS_CONFIG_PATH: ${DEPARTMENTS_CONFIG_PATH:-/app/config/departments.yaml}
      EMAIL_FROM: ${EMAIL_FROM:-ai-router@example.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config/departments.yaml:/app/config/departments.yaml:ro
    depends_on:
      mailpit:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.container_healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.2
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.34.2
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - run
      - ${OLLAMA_MODEL:-qwen3:1.7b}
      - Reply only with OK.
      - --think=false
      - --keepalive=-1s
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  ollama-data:
